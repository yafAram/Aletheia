services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aletheia_api
    # Set ALETHEIA_UID/ALETHEIA_GID in the shell before Compose so storage files
    # remain editable by the same Linux user who owns the project checkout.
    user: "${ALETHEIA_UID:-1000}:${ALETHEIA_GID:-1000}"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aletheia_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Para NVIDIA GPU, instala NVIDIA Container Toolkit y descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: aletheia_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
